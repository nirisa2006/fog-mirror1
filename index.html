<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#171716">
<title>fog</title>
<style>
  :root { color-scheme: dark; --cream: #f2eee7; }
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#171716; color:#f2eee7; font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  body { touch-action:none; }
  #app { position:fixed; inset:0; background:#171716; }
  #view { display:block; width:100%; height:100%; object-fit:contain; }
  #video { position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; }
  #start { position:absolute; inset:0; z-index:5; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:28px; text-align:center; background:radial-gradient(ellipse at 50% 43%,#373632 0%,#222220 45%,#171716 100%); }
  .wordmark { font-size:clamp(52px,15vw,94px); line-height:.95; letter-spacing:-.075em; font-weight:300; margin:0 0 18px; }
  .subtitle { max-width:310px; font-size:14px; line-height:1.65; color:#d2cec6; margin:0 0 30px; }
  #startButton { border:1px solid rgba(255,255,255,.75); background:#f2eee7; color:#252421; border-radius:999px; padding:15px 27px; font-size:14px; letter-spacing:.02em; font-weight:600; cursor:pointer; min-width:180px; }
  #privacy { margin-top:18px; color:#b5b1a9; font-size:11px; line-height:1.5; max-width:290px; }
  #status { margin-top:16px; min-height:20px; color:#f2eee7; font-size:13px; }
  #controls { position:absolute; inset:0; z-index:3; pointer-events:none; display:none; }
  #brushControl { pointer-events:auto; position:absolute; left:max(14px,env(safe-area-inset-left)); bottom:max(15px,env(safe-area-inset-bottom)); display:flex; align-items:center; gap:12px; padding:10px 14px; border:1px solid rgba(255,255,255,.28); border-radius:999px; background:rgba(238,234,226,.15); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); box-shadow:0 4px 24px #0002; color:#fff; }
  #brushControl label { font-size:12px; letter-spacing:.01em; font-weight:400; text-transform:lowercase; }
  #brushSize { width:clamp(100px,29vw,155px); accent-color:#fff; height:18px; margin:0; }
  #shutter { pointer-events:auto; position:absolute; right:max(17px,env(safe-area-inset-right)); bottom:max(15px,env(safe-area-inset-bottom)); width:52px; height:52px; border-radius:50%; border:1px solid rgba(255,255,255,.75); background:rgba(238,234,226,.18); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); display:grid; place-items:center; color:white; }
  #shutter svg { width:23px; height:23px; }
  #hint { position:absolute; top:max(18px,env(safe-area-inset-top)); left:50%; transform:translateX(-50%); white-space:nowrap; color:rgba(255,255,255,.82); font-size:11px; letter-spacing:.04em; text-shadow:0 1px 8px #0008; }
  #errorScreen { display:none; position:absolute; inset:0; z-index:8; background:#171716; color:#f2eee7; align-items:center; justify-content:center; padding:28px; text-align:center; font-size:16px; }
  @media (max-width:420px) { #brushControl { gap:9px; padding:9px 12px; } #brushSize { width:100px; } }
</style>
</head>
<body>
<div id="app">
  <video id="video" playsinline muted></video>
  <canvas id="view" aria-label="Fogged mirror"></canvas>
  <section id="start">
    <h1 class="wordmark">fog</h1>
    <p class="subtitle">A little breath. A little warmth.<br>Draw on the mirror and find yourself.</p>
    <button id="startButton" type="button">step into the mirror</button>
    <div id="privacy">Camera and microphone stay on this device.<br>No frames, audio, or data are ever uploaded.</div>
    <div id="status" role="status" aria-live="polite"></div>
  </section>
  <div id="errorScreen">Camera permission was denied.</div>
  <div id="controls">
    <div id="hint">pinch to draw · make a fist to wipe · hold space to fog</div>
    <div id="brushControl"><label for="brushSize">brush</label><input id="brushSize" type="range" min="7" max="38" value="15" step="1" aria-label="Brush size"></div>
    <button id="shutter" type="button" aria-label="Save image" title="Save image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7.5h3l1.4-2h7.2l1.4 2h3A1.5 1.5 0 0 1 21.5 9v9A1.5 1.5 0 0 1 20 19.5H4A1.5 1.5 0 0 1 2.5 18V9A1.5 1.5 0 0 1 4 7.5Z"/><circle cx="12" cy="13" r="4"/></svg>
    </button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection@0.4.1646425229/face_detection.js"></script>
<script>
'use strict';

const video = document.getElementById('video');
const canvas = document.getElementById('view');
const ctx = canvas.getContext('2d', { alpha: false });
const start = document.getElementById('start');
const startButton = document.getElementById('startButton');
const statusEl = document.getElementById('status');
const errorScreen = document.getElementById('errorScreen');
const controls = document.getElementById('controls');
const brushSize = document.getElementById('brushSize');
const shutter = document.getElementById('shutter');

const fogCanvas = document.createElement('canvas');
const fogCtx = fogCanvas.getContext('2d');
const frostCanvas = document.createElement('canvas');
const frostCtx = frostCanvas.getContext('2d');
const cameraCanvas = document.createElement('canvas');
const cameraCtx = cameraCanvas.getContext('2d');

let stream = null, audioContext = null, analyser = null, micSource = null, audioData = null;
let hands = null, faceDetection = null;
let running = false, processingHands = false, frameNo = 0, lastTime = 0;
let dpr = 1, W = 0, H = 0, shortEdge = 0;
let breathFloor = 0.001, breathLevel = 0, lastKeyTime = -Infinity, spaceDown = false;
let faceTarget = null, fogCenter = null;
let penDown = false, pinchLostAt = 0, releasedFrames = 0;
let rawPoint = null, smoothPoint = null, brushPoint = null, starPoint = null;
let lastDrawPoint = null, lastWipePoint = null, lastHandSeenAt = 0;
let lastPinch = false, gestureIndexExtended = false;
let lastLandmarks = null;
const landmarks = { wrist:0, thumbTip:4, indexTip:8, middleTip:12, ringTip:16, pinkyTip:20,
  indexMCP:5, middleMCP:9, ringMCP:13, pinkyMCP:17, indexPIP:6, middlePIP:10, ringPIP:14, pinkyPIP:18 };

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, Math.round(window.innerWidth * dpr));
  H = Math.max(1, Math.round(window.innerHeight * dpr));
  shortEdge = Math.min(W, H);
  for (const c of [canvas, fogCanvas, frostCanvas, cameraCanvas]) { c.width = W; c.height = H; }
  canvas.style.width = '100%'; canvas.style.height = '100%';
  fogCtx.clearRect(0,0,W,H);
  fogCtx.globalCompositeOperation = 'source-over';
  fogCtx.fillStyle = 'rgba(255,255,255,0.55)';
  fogCtx.fillRect(0,0,W,H);
  fogCenter = {x:W/2,y:H/2};
}
window.addEventListener('resize', resize, {passive:true});
resize();

function showDenied() {
  start.style.display = 'none';
  controls.style.display = 'none';
  errorScreen.style.display = 'flex';
}
function distance(a,b) { return Math.hypot(a.x-b.x,a.y-b.y); }
function lmPoint(lm) { return {x:(1-lm.x)*W,y:lm.y*H}; } // mirrored view coordinates
function lerpPoint(a,b,t) { return {x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}; }
function getLandmarkPoint(list, idx) { return lmPoint(list[idx]); }

function addFogBurst(cx, cy) {
  const spread = shortEdge * 0.43;
  for (let i=0; i<12; i++) {
    const angle = Math.random() * Math.PI * 2;
    const radial = Math.sqrt(Math.random()) * spread;
    const x = cx + Math.cos(angle) * radial * 1.45;
    const y = cy + Math.sin(angle) * radial + shortEdge * 0.025;
    const r = shortEdge * (0.045 + Math.random() * 0.075);
    const g = fogCtx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0, 'rgba(255,255,255,0.36)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    fogCtx.save();
    fogCtx.filter = `blur(${Math.max(1,r*0.60)}px)`;
    fogCtx.fillStyle = g;
    fogCtx.beginPath(); fogCtx.arc(x,y,r,0,Math.PI*2); fogCtx.fill();
    fogCtx.restore();
  }
}
function eraseStamp(x,y,r,alpha=0.34) {
  const grad = fogCtx.createRadialGradient(x,y,0,x,y,r);
  grad.addColorStop(0, `rgba(0,0,0,${alpha})`);
  grad.addColorStop(0.65, `rgba(0,0,0,${alpha*0.55})`);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  fogCtx.save();
  fogCtx.globalCompositeOperation = 'destination-out';
  fogCtx.fillStyle = grad;
  fogCtx.beginPath(); fogCtx.arc(x,y,r,0,Math.PI*2); fogCtx.fill();
  fogCtx.restore();
}
function eraseLine(a,b,r) {
  const dist = distance(a,b), step = Math.max(1,r*0.5);
  if (dist > shortEdge*0.30) { eraseStamp(b.x,b.y,r); return; }
  const stamps = Math.min(40, Math.max(1, Math.ceil(dist/step)));
  for (let i=1;i<=stamps;i++) {
    const t = i/stamps;
    eraseStamp(a.x+(b.x-a.x)*t, a.y+(b.y-a.y)*t, r);
  }
}
function drawStrokePoint(p) {
  if (!lastDrawPoint) { lastDrawPoint = p; eraseStamp(p.x,p.y,Number(brushSize.value)*dpr); return; }
  const delta = distance(lastDrawPoint,p);
  if (delta < W*0.0006) return;
  const mid = {x:(lastDrawPoint.x+p.x)/2,y:(lastDrawPoint.y+p.y)/2};
  fogCtx.save();
  fogCtx.globalCompositeOperation = 'destination-out';
  fogCtx.strokeStyle = 'rgba(0,0,0,1)';
  fogCtx.lineWidth = Number(brushSize.value)*2*dpr;
  fogCtx.lineCap = 'round'; fogCtx.lineJoin = 'round';
  // A soft edge gives the erased line a natural fingertip feel.
  fogCtx.shadowColor = 'rgba(0,0,0,0.45)';
  fogCtx.shadowBlur = Number(brushSize.value)*0.7*dpr;
  fogCtx.beginPath();
  fogCtx.moveTo(lastDrawPoint.x,lastDrawPoint.y);
  fogCtx.quadraticCurveTo(lastDrawPoint.x,lastDrawPoint.y,mid.x,mid.y);
  fogCtx.quadraticCurveTo(p.x,p.y,p.x,p.y);
  fogCtx.stroke();
  fogCtx.restore();
  lastDrawPoint = p;
}
function handWidth(list) {
  const wrist = getLandmarkPoint(list,0), middle = getLandmarkPoint(list,9);
  const knuckleSpan = distance(getLandmarkPoint(list,5),getLandmarkPoint(list,17));
  return Math.max(knuckleSpan,distance(wrist,middle));
}
function fingerCurled(list, tip, pip) {
  const wrist = getLandmarkPoint(list,0);
  return distance(getLandmarkPoint(list,tip),wrist) < distance(getLandmarkPoint(list,pip),wrist);
}
function isFist(list) {
  return fingerCurled(list,8,6) && fingerCurled(list,12,10) &&
         fingerCurled(list,16,14) && fingerCurled(list,20,18);
}
function indexExtended(list) {
  return distance(getLandmarkPoint(list,8),getLandmarkPoint(list,0)) >
         distance(getLandmarkPoint(list,6),getLandmarkPoint(list,0));
}
function updateHand(results, now) {
  const list = results.multiHandLandmarks && results.multiHandLandmarks[0];
  if (!list) {
    if (penDown) {
      if (!pinchLostAt) pinchLostAt = now;
      if (now-pinchLostAt > 250) {
        releasedFrames++;
        if (releasedFrames >= 2) endPen();
      }
    }
    lastLandmarks = null;
    return;
  }
  lastHandSeenAt = now; pinchLostAt = 0; releasedFrames = 0; lastLandmarks = list;
  const wrist = getLandmarkPoint(list,0);
  const indexMcp = getLandmarkPoint(list,9);
  const handScale = Math.max(1,distance(wrist,indexMcp));
  const pinchRatio = distance(getLandmarkPoint(list,4),getLandmarkPoint(list,8))/handScale;
  let pinch = lastPinch;
  if (pinchRatio < 0.22) pinch = true;
  else if (pinchRatio > 0.38) pinch = false;
  const fist = isFist(list);
  const indexIsExtended = indexExtended(list);
  if (fist) {
    endPen();
    const center = getLandmarkPoint(list,9);
    const radius = handWidth(list)*1.6;
    if (lastWipePoint) eraseLine(lastWipePoint,center,radius);
    else eraseStamp(center.x,center.y,radius);
    lastWipePoint = center;
  } else {
    lastWipePoint = null;
    if (pinch && !penDown && indexIsExtended) {
      penDown = true;
      rawPoint = getLandmarkPoint(list,8);
      smoothPoint = rawPoint; brushPoint = rawPoint; starPoint = rawPoint;
      lastDrawPoint = null;
    }
    if (penDown && pinch) {
      const target = getLandmarkPoint(list,8);
      rawPoint = lerpPoint(rawPoint || target,target,0.45);
      brushPoint = lerpPoint(brushPoint || rawPoint,rawPoint,0.22);
      starPoint = lerpPoint(starPoint || target,target,0.55);
      drawStrokePoint(brushPoint);
    } else if (penDown && !pinch) {
      endPen();
    }
  }
  lastPinch = pinch;
}
function endPen() {
  penDown = false; lastDrawPoint = null; rawPoint = null; smoothPoint = null; brushPoint = null;
}
function drawStar() {
  if (!penDown || !starPoint) return;
  const r = 4*dpr, p = starPoint;
  ctx.save();
  ctx.shadowColor = 'rgba(255,250,230,.95)'; ctx.shadowBlur = 13*dpr;
  ctx.fillStyle = 'rgba(255,252,239,.96)';
  ctx.beginPath();
  for(let i=0;i<8;i++) {
    const a = i*Math.PI/4;
    const rr = i%2===0 ? r : r*0.35;
    const x=p.x+Math.cos(a)*rr, y=p.y+Math.sin(a)*rr;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function sampleBreath(now) {
  if (!analyser || !audioData) return;
  analyser.getByteTimeDomainData(audioData);
  let sum=0;
  for(let i=0;i<audioData.length;i++) {
    const v=(audioData[i]-128)/128; sum += v*v;
  }
  breathLevel = Math.sqrt(sum/audioData.length);
  if (breathLevel < breathFloor) breathFloor += (breathLevel-breathFloor)*0.05;
  else breathFloor += (breathLevel-breathFloor)*0.0008;
  const allowed = now-lastKeyTime > 300 && !penDown;
  if (allowed && (spaceDown || breathLevel > breathFloor+0.0025) && frameNo%2===0) {
    const strength = spaceDown ? 1 : Math.min(1,(breathLevel-(breathFloor+0.0025))/0.0005);
    if (strength > 0 || spaceDown) {
      const cx = fogCenter ? fogCenter.x : W/2;
      const cy = fogCenter ? fogCenter.y : H/2;
      fogCtx.save(); fogCtx.globalAlpha = spaceDown ? 1 : Math.max(0.15,strength);
      addFogBurst(cx,cy); fogCtx.restore();
    }
  }
}
function updateFace() {
  if (!faceDetection || !video.videoWidth) return;
  // Face detection is sent asynchronously at a lower rate by the main loop.
}
function render() {
  if (!running) return;
  const now = performance.now();
  if (video.readyState >= 2 && video.videoWidth) {
    // Cover the viewport while preserving the camera aspect ratio.
    const scale = Math.max(W/video.videoWidth,H/video.videoHeight);
    const dw = video.videoWidth*scale, dh = video.videoHeight*scale;
    cameraCtx.save(); cameraCtx.clearRect(0,0,W,H);
    cameraCtx.translate(W,0); cameraCtx.scale(-1,1);
    cameraCtx.drawImage(video,(W-dw)/2,(H-dh)/2,dw,dh);
    cameraCtx.restore();

    sampleBreath(now);
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0,0,W,H);
    ctx.drawImage(cameraCanvas,0,0);

    frostCtx.clearRect(0,0,W,H);
    frostCtx.save();
    frostCtx.filter = `blur(${18*dpr}px) brightness(1.18)`;
    frostCtx.drawImage(cameraCanvas,0,0);
    frostCtx.restore();
    // Warm mist tint with a restrained white veil.
    frostCtx.save();
    frostCtx.globalCompositeOperation = 'source-atop';
    frostCtx.fillStyle = 'rgba(242,238,231,0.62)';
    frostCtx.fillRect(0,0,W,H);
    frostCtx.restore();
    frostCtx.save();
    frostCtx.globalCompositeOperation = 'destination-in';
    frostCtx.drawImage(fogCanvas,0,0);
    frostCtx.restore();
    ctx.drawImage(frostCanvas,0,0);
    drawStar();
  }
  frameNo++;
  if (hands && !processingHands && video.readyState >= 2 && frameNo%2===0) {
    processingHands = true;
    hands.send({image:video}).then(()=>{}).finally(()=>{processingHands=false;});
  }
  if (faceDetection && frameNo%5===0 && video.readyState>=2 && !faceDetectionBusy) {
    faceDetectionBusy = true;
    faceDetection.send({image:video}).finally(()=>{faceDetectionBusy=false;});
  }
  requestAnimationFrame(render);
}
let faceDetectionBusy = false;

async function startApp() {
  startButton.disabled = true;
  statusEl.textContent = 'Waking the mirror…';
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('UNSUPPORTED');
    }
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: {ideal:1280}, height:{ideal:720} },
      audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false }
    });
    video.srcObject = stream;
    await video.play();

    const audioTrack = stream.getAudioTracks()[0];
    if (audioTrack) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      micSource = audioContext.createMediaStreamSource(new MediaStream([audioTrack]));
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0;
      audioData = new Uint8Array(analyser.fftSize);
      micSource.connect(analyser);
    }

    if (!window.Hands || !window.FaceDetection) throw new Error('MEDIAPIPE');
    hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`});
    hands.setOptions({maxNumHands:1, modelComplexity:1, minDetectionConfidence:0.55, minTrackingConfidence:0.5});
    hands.onResults(updateHand);

    faceDetection = new FaceDetection({locateFile:(file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_detection@0.4.1646425229/${file}`});
    faceDetection.setOptions({model:'short', minDetectionConfidence:0.5});
    faceDetection.onResults((results)=>{
      const det = results.detections && results.detections[0];
      if (!det || !det.locationData || !det.locationData.relativeKeypoints) return;
      const mouth = det.locationData.relativeKeypoints[3] || det.locationData.relativeKeypoints[2];
      if (!mouth) return;
      const target = {x:(1-mouth.x)*W,y:mouth.y*H+shortEdge*0.045};
      faceTarget = target;
      fogCenter = lerpPoint(fogCenter || target,target,0.4);
    });

    start.style.display = 'none';
    errorScreen.style.display = 'none';
    controls.style.display = 'block';
    running = true;
    requestAnimationFrame(render);
  } catch (err) {
    console.error(err);
    if (err && (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError' || err.name === 'SecurityError')) {
      showDenied();
    } else {
      statusEl.textContent = err && err.message === 'UNSUPPORTED'
        ? 'Camera access needs a secure page (HTTPS or localhost).'
        : 'The mirror could not start. Check camera and microphone access, then reload.';
      startButton.disabled = false;
    }
    if (stream) stream.getTracks().forEach(t=>t.stop());
  }
}
startButton.addEventListener('click', startApp);
brushSize.addEventListener('input',()=>{});
shutter.addEventListener('click',saveImage);
function saveImage() {
  // The visible canvas is the current composite, including the mirrored face and fog.
  const link = document.createElement('a');
  link.download = 'fog-mirror.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}
function clearDrawing() {
  // Restore the initial fog layer; drawing and wiping only change its alpha.
  fogCtx.save();
  fogCtx.globalCompositeOperation = 'source-over';
  fogCtx.clearRect(0,0,W,H);
  fogCtx.fillStyle = 'rgba(255,255,255,0.55)';
  fogCtx.fillRect(0,0,W,H);
  fogCtx.restore();
}
window.addEventListener('keydown',(e)=>{
  lastKeyTime = performance.now();
  if (e.code==='Space') { e.preventDefault(); spaceDown=true; }
  if (e.key.toLowerCase()==='c' && running) clearDrawing();
  if (e.key.toLowerCase()==='s' && running) saveImage();
  if (e.key==='Escape' && running) {
    running=false;
    if(stream) stream.getTracks().forEach(t=>t.stop());
    if(audioContext) audioContext.close();
    start.style.display='flex'; controls.style.display='none'; statusEl.textContent='';
    startButton.disabled=false;
  }
});
window.addEventListener('keyup',(e)=>{ if(e.code==='Space') spaceDown=false; });
window.addEventListener('blur',()=>{spaceDown=false;});
</script>
</body>
</html>
